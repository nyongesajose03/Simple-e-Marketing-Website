<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SEJO'S LIMITED</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="index.html">SEJO'S LIMITED</a>
        <p class="eyebrow">Welcome back</p>
        <h1>Login to your account</h1>
        <p class="auth-description">Enter your details below to continue shopping.</p>
        <form action="home.html" method="get">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button class="button" type="submit">Login</button>
        </form>
        <p class="auth-footer">New here? <a href="signup.html">Create an account</a></p>
    </main>
</body>
</html>
