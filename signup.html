<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SEJO'S LIMITED</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="index.html">SEJO'S LIMITED</a>
        <p class="eyebrow">Join our community</p>
        <h1>Create an account</h1>
        <p class="auth-description">Add your details below to get started.</p>
        <form action="login.html" method="get">
            <div class="form-group">
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="first-name" autocomplete="given-name" required>
            </div>
            <div class="form-group">
                <label for="last-name">Last name</label>
                <input type="text" id="last-name" name="last-name" autocomplete="family-name" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
            </div>
            <button class="button" type="submit">Sign Up</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
    </main>
</body>
</html>
